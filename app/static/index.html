<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --user:#2563eb; --bot:#334155; --text:#e2e8f0; --muted:#94a3b8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           background:var(--bg); color:var(--text); height:100dvh; display:flex; flex-direction:column; }
    header { padding:14px 18px; background:var(--panel); font-weight:600; border-bottom:1px solid #334155;
             display:flex; justify-content:space-between; align-items:center; }
    header small { color:var(--muted); font-weight:400; }
    #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
    .msg { max-width:75%; padding:10px 14px; border-radius:14px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
    .user { align-self:flex-end; background:var(--user); border-bottom-right-radius:4px; }
    .bot  { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
    .meta { align-self:center; color:var(--muted); font-size:12px; }
    /* auto-direction: Arabic renders RTL, English LTR */
    .msg:dir(rtl) { text-align:right; }
    form { display:flex; gap:10px; padding:14px; background:var(--panel); border-top:1px solid #334155; }
    #input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid #475569;
             background:#0b1220; color:var(--text); font-size:15px; }
    #input:focus { outline:none; border-color:var(--user); }
    button { padding:12px 20px; border:none; border-radius:10px; background:var(--user); color:#fff;
             font-size:15px; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
  </style>
</head>
<body>
  <header>
    <span>💬 Chatbot</span>
    <small id="sid"></small>
  </header>
  <div id="log">
    <div class="meta">Ask me anything — بالعربي أو بالإنجليزي</div>
  </div>
  <form id="form" autocomplete="off">
    <input id="input" placeholder="Type your message…" autofocus />
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    // one stable session id per browser tab session
    const sessionId = "web-" + Math.random().toString(36).slice(2, 10);
    document.getElementById("sid").textContent = sessionId;

    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.setAttribute("dir", "auto"); // let the browser pick RTL/LTR from content
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    // Tell the server "user is still typing" so a pending reply keeps waiting.
    // Throttled to at most one ping per second while actively typing.
    let lastTypingPing = 0;
    input.addEventListener("input", () => {
      const now = Date.now();
      if (now - lastTypingPing < 1000) return;
      lastTypingPing = now;
      fetch("/typing", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId })
      }).catch(() => {});  // best-effort; ignore failures
    });

    // Reveal text one character at a time, like a person typing.
    async function typeInto(div, text) {
      div.textContent = "";
      for (const ch of text) {
        div.textContent += ch;
        log.scrollTop = log.scrollHeight;
        // ~45ms per char with slight randomness; longer pause after sentence breaks
        let delay = 30 + Math.random() * 40;
        if (".!?،؟\n".includes(ch)) delay += 250;
        await sleep(delay);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMsg(message, "user");
      input.value = "";
      input.focus();
      // Note: we do NOT disable the Send button — the backend debounces messages,
      // so the user must be free to fire off several in a row within the wait window.
      const thinking = addMsg("…", "bot");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        // This message was superseded by a newer one — drop its placeholder bubble.
        if (data.skipped) {
          thinking.remove();
          return;
        }

        // "Type" the answer out like a human instead of dumping it instantly.
        await typeInto(thinking, data.answer ?? "(no answer)");
      } catch (err) {
        thinking.textContent = "⚠️ Error: " + err.message;
      }
    });
  </script>
</body>
</html>
